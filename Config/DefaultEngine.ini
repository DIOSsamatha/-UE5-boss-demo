; ★ 2026-10-06：关掉屏幕左上角那堆黄色引擎消息。
;   现象：竞技场（Fab 那个 57m×144m 的单体非 Nanite 网格）阴影铺满 Virtual Shadow Map，
;   引擎每 6 秒往屏幕上插一条黄色警告：
;     "[7/8]非Nanite标注工作队列溢出… 6 seconds ago. See r.Shadow.Virtual.AllowScreenOverflowMessages"
;   它是引擎源码里主动 Add 到屏幕消息列表的
;   （VirtualShadowMapCacheManager.cpp: `if (GVSMAllowScreenOverflowMessages != 0) OutMessages.Add(Warning…)`），
;   不是我们自己的日志。
;   两道保险：
;     ① r.Shadow.Virtual.AllowScreenOverflowMessages=0 —— 不再往上屏幕插这条消息（治源）
;     ② bEnableOnScreenDebugMessages=False —— 整个屏幕消息系统关掉（治面，PIE/打包都生效）
;   ⚠ 这两个都是**启动时读取**的配置，改完要重启编辑器才生效。
;     当场想用控制台的话：~ 键打开控制台输 DisableAllScreenMessages（EnableAllScreenMessages 恢复）。
bEnableOnScreenDebugMessages=False

[SystemSettings]
r.Shadow.Virtual.AllowScreenOverflowMessages=0

